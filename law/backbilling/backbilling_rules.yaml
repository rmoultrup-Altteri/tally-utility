# Texas gas backbilling: the sixteen rows adopted in place by v5.4.2-18 from public.backbilling_rules
# (v5.4.2-13; Kyle's rulings R-19 to R-39 on 16 TAC 7.45). One row per (customer class, cause).
# Eight rows (class `protected`) are law; eight (class `unprotected`) are DELEGATIONS: their own note says
# 16 TAC 7.45 does not reach the class, so the law leaves the matter to the utility's tariff (patch R10).
# For a law row, `terms` says exactly what the old columns and window terms said, `source_note` is the -13 note
# verbatim, and the document's `citation` is the lead clause of that note (before its first " — " or ";").
# Window terms and qualifying outcomes are listed in byte order, so one law has one document.
# Applicability: investor-owned and cooperative owners, distribution systems, either jurisdiction status.
# Utilities Code 101.003(7) excludes a municipal corporation and LPG distribution (propane systems);
# 7.45's preamble orders every gas distribution utility to carry the standards into incorporated areas
# except where a city's lawful standards conflict (patch R8). Master-meter systems are out by default (R9).
