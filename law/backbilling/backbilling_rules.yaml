  - name: protected_meter_error
    state_code: TX
    service_type: gas
    owner_types: [investor_owned, cooperative]
    system_kinds: [distribution]
    commission_jurisdiction: any
    customer_class: protected
    cause: meter_error
    effective_from: "2004-07-12"
    source_note: "16 TAC 7.45(7)(B)(v)(I) — correction for the shorter of the last six months and the last test of the meter (R-34: the most recent completed test before the discovering test, any outcome); R-37(a) adds the meter's deployment start; a fast meter's refund back to that window is mandatory (R-37); a straddling adverse period is forfeited whole (R-32); corrected on a subsequent bill (R-33); (4)(E)(vi) bars disconnection for an underbilling due to faulty metering (F-1)."
    terms:
      governs: law
      citation: "16 TAC 7.45(7)(B)(v)(I)"
      anchor: {strategy: test_date, version: 1, qualifying_outcomes: [fast, slow]}
      favourable_duty: mandatory
      adverse_straddle: forfeit_whole
      favourable_straddle: include_whole
      delivery_path: adjustment
      requires_supervisor_evidence: false
      units_invariant: false
      enforcement: {strategy: never, version: 1}
      windows:
        adverse:
          - {kind: before_anchor, quantity: 6, unit: months}
          - {kind: deployment_start}
          - {kind: last_test_any_outcome}
        favourable:
          - {kind: before_anchor, quantity: 6, unit: months}
          - {kind: deployment_start}
          - {kind: last_test_any_outcome}
